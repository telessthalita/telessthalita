# Gera a cobrinha que come o gráfico de contribuições (em roxo) e publica no branch "output".
name: cobrinha das contribuições

on:
  schedule:
    - cron: "0 9 * * *" # todo dia, 6h no horário de Brasília
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/cobrinha.svg?palette=github-light&color_snake=#7b2fff&color_dots=#ebedf0,#e4d6ff,#c3a6ff,#9b6bff,#7b2fff
            dist/cobrinha-dark.svg?palette=github-dark&color_snake=#d9c2ff&color_dots=#161b22,#2e1a52,#4a1fb8,#7b2fff,#b99cff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
